<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whitney Collins</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream:      #FAF7F2;
      --warm-light: #F0E6D8;
      --terra:      #C17A73;
      --brown-dark: #3D2B1F;
      --text-light: #7A6355;
      --font-head:  'Bodoni Moda', Georgia, serif;
      --font-body:  'Jost', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--brown-dark);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .logo {
      font-family: var(--font-head);
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--brown-dark);
      letter-spacing: .02em;
      margin-bottom: 40px;
    }
    .logo span { color: var(--terra); }

    .divider {
      width: 40px; height: 2px;
      background: var(--terra);
      margin: 0 auto 32px;
    }

    h1 {
      font-family: var(--font-head);
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 600;
      line-height: 1.15;
      color: var(--brown-dark);
      margin-bottom: 16px;
    }
    h1 span { color: var(--terra); }

    p {
      font-size: .95rem;
      color: var(--text-light);
      line-height: 1.7;
      margin-bottom: 40px;
    }

    .input-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input[type="password"] {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid rgba(74,55,40,.15);
      border-radius: 4px;
      background: var(--warm-light);
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--brown-dark);
      letter-spacing: .08em;
      outline: none;
      text-align: center;
      transition: border-color .2s;
    }
    input[type="password"]:focus { border-color: var(--terra); }
    input[type="password"]::placeholder { letter-spacing: .04em; color: #b0998c; }

    button {
      width: 100%;
      padding: 14px;
      background: var(--terra);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: var(--font-body);
      font-size: .85rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .2s;
    }
    button:hover { background: #A5625A; }

    .error {
      font-size: .82rem;
      color: var(--terra);
      margin-top: 4px;
      min-height: 20px;
    }

    .footer-note {
      margin-top: 48px;
      font-size: .78rem;
      color: rgba(74,55,40,.35);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Whitney <span>Collins</span></div>
    <div class="divider"></div>
    <h1>Something <span>beautiful</span> is coming.</h1>
    <p>This site is getting the final touches. If you have a password, enter it below:</p>
    <div class="input-wrap">
      <input type="password" id="pw" placeholder="Enter password" autocomplete="off" />
      <button onclick="checkPassword()">Enter</button>
      <p class="error" id="error"></p>
    </div>
    <p class="footer-note">Whitney Collins Coaching &copy; 2026</p>
  </div>

  <script>
    // If already authenticated, go straight to the site
    if (localStorage.getItem('wc_auth') === 'granted') {
      window.location.href = 'index.html';
    }

    function checkPassword() {
      const val = document.getElementById('pw').value;
      if (val === 'OslerHali888') {
        localStorage.setItem('wc_auth', 'granted');
        window.location.href = 'index.html';
      } else {
        document.getElementById('error').textContent = 'Incorrect password. Try again.';
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
      }
    }

    document.getElementById('pw').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
  </script>
</body>
</html>
