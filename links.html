<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whitney Collins | Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400;1,6..96,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .links-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background: var(--cream);
    }
    .links-card {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .links-name {
      font-family: var(--font-head);
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 600;
      color: var(--brown-dark);
      text-align: center;
      margin-bottom: 4px;
    }
    .links-tagline {
      font-family: var(--font-body);
      font-size: .9rem;
      font-weight: 400;
      color: var(--text-light);
      letter-spacing: .04em;
      text-align: center;
      margin-bottom: 8px;
    }
    .links-divider {
      width: 40px;
      height: 2px;
      background: var(--terra);
      margin: 4px auto 20px;
    }
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px 28px;
      border-radius: var(--radius);
      font-family: var(--font-body);
      font-size: .88rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .2s ease;
      text-decoration: none;
    }
    .link-btn--primary {
      background: var(--terra);
      color: var(--white);
      border: 2px solid var(--terra);
    }
    .link-btn--primary:hover {
      background: var(--terra-dark);
      border-color: var(--terra-dark);
    }
    .link-btn--outline {
      background: transparent;
      color: var(--terra);
      border: 2px solid var(--terra);
    }
    .link-btn--outline:hover {
      background: var(--terra);
      color: var(--white);
    }
    .links-footer {
      margin-top: 32px;
      font-family: var(--font-body);
      font-size: .78rem;
      color: var(--text-light);
      letter-spacing: .04em;
    }
    .links-footer a {
      color: var(--terra);
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>

  <main class="links-page">
    <div class="links-card">

      <p class="links-name">Whitney Collins</p>
      <p class="links-tagline">Self-Trust, Purpose &amp; Personal Transformation</p>
      <div class="links-divider"></div>

      <a href="contact.html" class="link-btn link-btn--primary">
        Book a Discovery Call
      </a>

      <a href="https://whitneyycollins.substack.com/" class="link-btn link-btn--outline" target="_blank" rel="noopener">
        Read My Substack
      </a>

      <a href="https://talanuva.com" class="link-btn link-btn--outline" target="_blank" rel="noopener">
        Explore Talanuva
      </a>

      <a href="https://instagram.com/whitneycollins" class="link-btn link-btn--outline" target="_blank" rel="noopener">
        Instagram — @whitneycollins
      </a>

      <p class="links-footer">
        <a href="index.html">whitneycollins.co</a>
      </p>

    </div>
  </main>

</body>
</html>
